<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CRISPR Short v3</title>
<style>
@font-face{font-family:'Instrument Serif';font-style:italic;src:url(fonts/instrument-serif-italic.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:normal;src:url(fonts/instrument-serif.woff2) format('woff2')}
@font-face{font-family:'Caveat';font-weight:700;src:url(fonts/caveat-700.woff2) format('woff2')}
:root{--ink:#1B1B1B;--red:#E03A2F;--green:#1F8F5A;--purple:#6B5BD6;--paper:#F4EFE6}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(ellipse 120% 80% at 50% 40%,#F8F4EC 0%,#F1EBDF 60%,#E6DECF 100%)}
#grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;pointer-events:none}
#cam{position:absolute;inset:0;transform-origin:540px 820px}
.scene{position:absolute;inset:0;display:none;transform-origin:540px 820px}
.abs{position:absolute}
.ctr{position:absolute;left:0;width:1080px;text-align:center}
.sans{font-family:'Inter Display','Inter',sans-serif;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.mono{font-family:'JetBrains Mono',monospace;font-weight:700}
.hand{font-family:'Caveat',cursive;font-weight:700}
.brand{top:84px;font:500 26px 'JetBrains Mono';color:#8B8478;letter-spacing:.02em}
.tile{position:absolute;width:150px;height:172px;border:7px solid var(--ink);border-radius:24px;background:#fff;
  box-shadow:0 9px 0 var(--ink);display:flex;align-items:center;justify-content:center;
  font:800 104px 'JetBrains Mono';color:var(--ink);transform-origin:50% 50%}
.tile.bad{background:#FBE1DC;color:var(--red)}
.tile.good{background:#DDF2E6;color:var(--green)}
.sticker{position:absolute;padding:10px 22px;border:5px solid var(--ink);border-radius:16px;background:#FFF8E1;
  font:700 36px 'JetBrains Mono';color:var(--ink);box-shadow:0 6px 0 var(--ink);white-space:nowrap}
.mark{background-image:linear-gradient(transparent 58%,#FFCFC4 58%,#FFCFC4 92%,transparent 92%);
  background-repeat:no-repeat;background-size:0% 100%}
#cap{position:absolute;left:60px;width:960px;top:1296px;text-align:center;
  font:800 68px/1.12 'Inter Display','Inter',sans-serif;color:var(--ink);letter-spacing:-.01em}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .08em .16em;margin:0 -.08em -.16em}
.wi{display:inline-block;will-change:transform}
.photo{position:absolute;border-radius:50%;overflow:hidden;border:16px solid #1B1B1B;background:#fff;box-shadow:0 0 0 4px rgba(27,27,27,.25),0 18px 40px rgba(60,30,20,.18)}
.photo .kb{position:absolute;left:0;top:0;transform-origin:0 0}
.credit{position:absolute;font:500 20px 'JetBrains Mono';color:#9A9285;letter-spacing:.01em}
.polaroid{position:absolute;background:#FFFDF8;padding:16px 16px 0;border-radius:6px;box-shadow:0 14px 34px rgba(40,25,15,.28),0 2px 0 rgba(0,0,0,.06)}
.polaroid img{display:block;width:100%;border-radius:2px}
#bg{position:absolute;inset:-60px;pointer-events:none}
#bg i{position:absolute;border-radius:50%;filter:blur(40px)}
#cap span{display:inline-block;margin:0 9px;transform-origin:50% 80%}
.card{position:absolute;border:6px solid var(--ink);border-radius:30px;background:#FFFDF8;box-shadow:0 10px 0 var(--ink)}
.code{position:absolute;left:90px;width:900px;top:560px;height:520px;border-radius:30px;background:#1D1B24;
  box-shadow:0 12px 0 #0E0D12;padding:96px 46px 0;font:600 46px/1.65 'JetBrains Mono';color:#E9E6F2}
.code .dots{position:absolute;top:30px;left:36px}
.code .dots i{display:inline-block;width:22px;height:22px;border-radius:50%;margin-right:12px}
.ln{position:relative;white-space:pre}
.c-com{color:#7E7A8E}.c-kw{color:#C792EA}.c-fn{color:#82AAFF}.c-ok{color:#7FE0A8}
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/>
        <feDisplacementMap in="SourceGraphic" scale="5"/>
      </filter>
      <radialGradient id="rbc" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#F49A8E"/><stop offset="55%" stop-color="#E5574C"/><stop offset="100%" stop-color="#C93C33"/>
      </radialGradient>
      <linearGradient id="sick" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#D2463C"/><stop offset="100%" stop-color="#A92F28"/>
      </linearGradient>
      <radialGradient id="scopebg" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="#FBEDE6"/><stop offset="80%" stop-color="#F3D9CF"/><stop offset="100%" stop-color="#D9B5A8"/>
      </radialGradient>
    </defs>
  </svg>
  <svg id="grain" width="1120" height="1960" style="left:-20px;top:-20px"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .33  0 0 0 .55 0"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
  <div id="bg"></div>
  <div id="cam"></div>
  <div class="ctr brand" id="brand">{ } source_code_of_life</div>
  <div id="cap"></div>
</div>
<script>
// ---------- yardımcılar ----------
const SVGNS='http://www.w3.org/2000/svg';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.9,c3=c1+1;return x<=0?0:1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function el(tag,parent,cls,css,html){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;parent.appendChild(e);return e}
function sv(tag,parent,attrs){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
function svgBox(parent,x,y,w,h,vb){const s=sv('svg',parent,{width:w,height:h,viewBox:vb||`0 0 ${w} ${h}`});s.style.cssText=`position:absolute;left:${x}px;top:${y}px;overflow:visible`;return s}
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const tf=(e,s)=>{e.style.transform=s};
const op=(e,v)=>{e.style.opacity=v};
function pathLen(d){const t=sv('path',document.querySelector('defs'),{d});const l=t.getTotalLength();t.remove();return l}
function draw_on(path,len,x){path.style.strokeDasharray=len;path.style.strokeDashoffset=len*(1-x);path.style.opacity=x>0?1:0}

const END=28.5;
const cam=document.getElementById('cam');

// ---------- altyazı zamanlaması (yeni zaman çizgisi) ----------
const CHUNKS=[
 [0.00,"The first CRISPR"],[0.917,"medicine doesn't"],[1.85,"fix the typo."],
 [2.817,"Sickle cell"],[3.55,"disease comes from"],[4.617,"one wrong letter"],[5.617,"in one gene."],
 [6.55,"You'd think the"],[7.283,"treatment edits"],[7.983,"that letter back."],[8.95,"It doesn't."],
 [9.917,"Casgevy breaks a"],[10.983,"different switch"],[12.517,"called BCL11A"],
 [13.65,"in the patient's"],[14.717,"own blood stem"],[16.05,"cells."],
 [16.85,"That switch shuts"],[17.883,"off fetal"],[18.483,"hemoglobin after"],[19.45,"birth."],
 [20.117,"Break the switch"],[21.083,"and the baby"],[21.817,"version turns back"],[22.85,"on and takes"],[23.583,"over the job."],
 [24.317,"Sometimes the fix"],[25.25,"isn't fixing the"],[26.117,"bug."],
 [26.65,"It's turning on"],[27.417,"the backup."]];
const SPEECH_END=27.97;
const ACCENT=new Set(['CRISPR',"doesn't",'typo.','wrong','letter','one','gene.','letter','back.','different','switch','BCL11A','own','fetal','hemoglobin','birth.','baby','bug.','backup.','fix']);
const capEl=document.getElementById('cap');
const capWords=CHUNKS.map((c,i)=>{
  const next=i+1<CHUNKS.length?CHUNKS[i+1][0]:SPEECH_END;
  const ws=c[1].split(' ');const tot=ws.reduce((a,w)=>a+w.length+2,0);
  let acc=c[0];const span=(next-c[0])*0.86;
  return ws.map(w=>{const s=acc;acc+=span*(w.length+2)/tot;return{w,s}})
});
let capIdx=-1,capSpans=[];
function drawCaptions(t,show){
  if(!show||t>=SPEECH_END+0.1){capEl.style.opacity=0;return}
  let i=-1;for(let k=0;k<CHUNKS.length;k++)if(CHUNKS[k][0]<=t)i=k;
  if(i<0){capEl.style.opacity=0;return}
  if(i!==capIdx){capEl.innerHTML='';capSpans=capWords[i].map(o=>el('span',capEl,'','',o.w));capIdx=i}
  capEl.style.opacity=1;
  const k=eb(p(t,CHUNKS[i][0],CHUNKS[i][0]+0.16));
  tf(capEl,`translateY(${(1-k)*18}px) scale(${lerp(.9,1,k)})`);
  capWords[i].forEach((o,j)=>{const s=capSpans[j];const on=t>=o.s;const a=eb(p(t,o.s,o.s+.14));
    const nxt=j+1<capWords[i].length?capWords[i][j+1].s:9e9;const cur=on&&t<nxt;
    s.style.color=cur?'#E03A2F':(ACCENT.has(o.w)&&on?'#E03A2F':'#1B1B1B');
    s.style.opacity=on?1:.28;tf(s,`scale(${cur?lerp(1,1.07,a):1})`)});
}

// ---------- ortak çizimler ----------
function makeTiles(parent,letters,y,cls){
  const gap=26,w=150,total=letters.length*w+(letters.length-1)*gap,x0=(1080-total)/2;
  return letters.split('').map((L,i)=>{const t=el('div',parent,'tile '+(cls?cls[i]||'':''),`left:${x0+i*(w+gap)}px;top:${y}px`,L);t.dataset.x=x0+i*(w+gap);return t})
}
function cellRound(g,s){sv('circle',g,{r:s*.86,fill:'url(#rbc)',stroke:'#A9322A','stroke-width':3});sv('circle',g,{r:s*.38,fill:'#F7A79C',opacity:.75})}
function cellSickle(g,s){sv('path',g,{d:`M${-s*1.1} ${s*.35} A ${s*1.1} ${s*1.1} 0 0 1 ${s*1.1} ${s*.35} A ${s*1.55} ${s*1.05} 0 0 0 ${-s*1.1} ${s*.35}Z`,fill:'url(#sick)',stroke:'#8E241E','stroke-width':3,'stroke-linejoin':'round'})}
function makeScope(parent,cx,cy,r,seed,n,sickleIdx){
  const box=svgBox(parent,cx-r-30,cy-r-30,2*r+60,2*r+60,`${-r-30} ${-r-30} ${2*r+60} ${2*r+60}`);
  const id='clip'+seed;const cp=sv('clipPath',box,{id});sv('circle',cp,{r});
  const inner=sv('g',box,{'clip-path':`url(#${id})`});
  sv('circle',inner,{r,fill:'url(#scopebg)'});
  const R=rng(seed),cells=[];
  for(let i=0;i<n;i++){
    let a,d,x,y,s,tries=0;do{a=R()*Math.PI*2;d=Math.sqrt(R())*r*.86;x=Math.cos(a)*d;y=Math.sin(a)*d;s=27+R()*9;tries++}
    while(tries<400&&cells.some(c=>Math.hypot(c.x-x,c.y-y)<(c.s+s)*1.25));
    const g=sv('g',inner,{});const gr=sv('g',g,{});cellRound(gr,s);const gs=sv('g',g,{});cellSickle(gs,s);
    cells.push({g,gr,gs,x,y,s,rot:R()*360,ph:R()*6.28,sick:sickleIdx.includes(i),delay:R()})
  }
  sv('circle',box,{r,fill:'none',stroke:'#1B1B1B','stroke-width':16});
  sv('circle',box,{r:r+16,fill:'none',stroke:'#1B1B1B','stroke-width':3,opacity:.35});
  return{box,cells,update(t,heal=0,pulse=0){cells.forEach(c=>{
    const dx=Math.sin(t*.7+c.ph)*9,dy=Math.cos(t*.55+c.ph)*9,rot=c.rot+Math.sin(t*.4+c.ph)*12;
    let m=c.sick?1:0;if(c.sick)m=1-eio(p(heal,c.delay*.55,c.delay*.55+.45));
    const pl=c.sick?1+pulse*.12*Math.max(0,Math.sin(t*12)):1;
    c.g.setAttribute('transform',`translate(${c.x+dx} ${c.y+dy}) rotate(${rot}) scale(${pl})`);
    const q=clamp((m-.35)/.3);c.gs.setAttribute('opacity',q);c.gr.setAttribute('opacity',1-q);
    c.gs.setAttribute('transform',`scale(${lerp(.8,1,m)})`);c.gr.setAttribute('transform',`scale(${lerp(.75,1,1-m)})`)})}}
}
function makePhotoScope(parent,cx,cy,r,src,iw){
  const box=el('div',parent,'photo',`left:${cx-r}px;top:${cy-r}px;width:${2*r}px;height:${2*r}px`);
  const kb=el('div',box,'kb',`width:${iw}px;height:${iw}px`);const img=el('img',kb,'','width:100%;height:100%;display:block');img.src=src;
  return{box,set(cxImg,cyImg,s){const inner=2*r-32;tf(kb,`translate(${inner/2-cxImg*s}px,${inner/2-cyImg*s}px) scale(${s})`)}}
}
function makeSwitch(parent,cx,cy,sc){
  const box=svgBox(parent,cx-260*sc,cy-160*sc,520*sc,320*sc,'-260 -160 520 320');
  const halves=[];
  [['L','-260,-160 8,-160 -14,-60 22,-10 -10,50 12,160 -260,160'],['R','8,-160 260,-160 260,160 12,160 -10,50 22,-10 -14,-60']].forEach(([k,pts])=>{
    const id='sw'+k+Math.round(cx)+Math.round(cy);const cp=sv('clipPath',box,{id});sv('polygon',cp,{points:pts});
    const g=sv('g',box,{});const gi=sv('g',g,{'clip-path':`url(#${id})`});
    const track=sv('rect',gi,{x:-200,y:-100,width:400,height:200,rx:100,fill:'#BFE6D2',stroke:'#1B1B1B','stroke-width':10});
    const knob=sv('circle',gi,{cx:100,cy:0,r:78,fill:'#fff',stroke:'#1B1B1B','stroke-width':10});
    halves.push({g,track,knob})});
  const crack=sv('polyline',box,{points:'8,-120 -14,-60 22,-10 -10,50 12,120',fill:'none',stroke:'#E03A2F','stroke-width':9,'stroke-linejoin':'round',opacity:0});
  const slash=sv('path',box,{d:'M-230 -120 L230 120',stroke:'#E03A2F','stroke-width':16,'stroke-linecap':'round',fill:'none',filter:'url(#rough)'});
  const sl=pathLen('M-230 -120 L230 120');
  return{box,set(on,brk,sl_x){halves.forEach(h=>{h.knob.setAttribute('cx',lerp(-100,100,on));h.track.setAttribute('fill',on>.5?'#BFE6D2':'#E9E4DA')});
    halves[0].g.setAttribute('transform',`translate(${-brk*34} ${brk*10}) rotate(${-brk*7})`);
    halves[1].g.setAttribute('transform',`translate(${brk*34} ${-brk*6}) rotate(${brk*6})`);
    crack.setAttribute('opacity',brk>0&&brk<.35?1:0);draw_on(slash,sl,sl_x||0)}}
}
function makeScissors(parent){
  const box=svgBox(parent,0,0,340,200,'-200 -100 340 200');box.style.left='0px';
  const arms=[0,1].map(i=>{const g=sv('g',box,{});
    sv('polygon',g,{points:'40,-9 -175,0 40,9',fill:'#D9E0E7',stroke:'#1B1B1B','stroke-width':5,'stroke-linejoin':'round'});
    sv('line',g,{x1:30,y1:0,x2:58,y2:0,stroke:'#1B1B1B','stroke-width':12});
    sv('circle',g,{cx:88,cy:0,r:30,fill:'none',stroke:'#E03A2F','stroke-width':14});return g});
  sv('circle',box,{r:9,fill:'#1B1B1B'});
  return{box,set(x,y,open,rot=0,s=1){box.style.transform=`translate(${x-200}px,${y-100}px) rotate(${rot}deg) scale(${s})`;box.style.transformOrigin='200px 100px';
    arms[0].setAttribute('transform',`rotate(${-open*22})`);arms[1].setAttribute('transform',`rotate(${open*22})`)}}
}
function handPath(parent,x,y,w,h,d,color,sw){const s=svgBox(parent,x,y,w,h);const pth=sv('path',s,{d,fill:'none',stroke:color,'stroke-width':sw,'stroke-linecap':'round','stroke-linejoin':'round',filter:'url(#rough)'});return{s,pth,len:pathLen(d)}}
function person(parent,x,y,sc,color){const s=svgBox(parent,x,y,160*sc,220*sc,'-80 -110 160 220');
  const g=sv('g',s,{fill:'none',stroke:color||'#1B1B1B','stroke-width':8,'stroke-linecap':'round',filter:'url(#rough)'});
  sv('circle',g,{cx:0,cy:-62,r:34});sv('path',g,{d:'M-62 100 Q-62 -10 0 -10 Q62 -10 62 100'});
  sv('circle',g,{cx:-12,cy:-66,r:2.5,fill:'#1B1B1B'});sv('circle',g,{cx:12,cy:-66,r:2.5,fill:'#1B1B1B'});sv('path',g,{d:'M-10 -50 Q0 -42 10 -50'});return s}
function baby(parent,x,y,sc){const s=svgBox(parent,x,y,140*sc,140*sc,'-70 -70 140 140');
  const g=sv('g',s,{stroke:'#1B1B1B','stroke-width':6,'stroke-linecap':'round',filter:'url(#rough)'});
  sv('ellipse',g,{cx:0,cy:24,rx:46,ry:38,fill:'#E9E2FB'});sv('circle',g,{cx:0,cy:-28,r:30,fill:'#FFE9DA'});
  sv('circle',g,{cx:-10,cy:-30,r:2.5,fill:'#1B1B1B'});sv('circle',g,{cx:10,cy:-30,r:2.5,fill:'#1B1B1B'});sv('path',g,{d:'M-7 -18 Q0 -13 7 -18',fill:'none'});
  sv('path',g,{d:'M-4 -58 Q4 -66 2 -56',fill:'none'});return s}

// ---------- sahneler ----------
const scenes=[];
function scene(a,b,build,draw,opts={}){const root=el('div',cam,'scene');const o={a,b,root,draw,...opts};build(root,o);scenes.push(o);return o}

// 1) HOOK
const hook=scene(0,2.817,(r,o)=>{
  o.l1=el('div',r,'ctr sans','top:236px;font-size:84px;line-height:1.05','<span class="mark">The</span> <span class="mark">first</span> <span class="mark" style="color:#E03A2F">CRISPR</span><br><span class="mark">medicine</span>');
  o.l2=el('div',r,'ctr sans','top:430px;font-size:182px;font-weight:900;color:#E03A2F;letter-spacing:-.03em;line-height:1','doesn\'t fix');
  o.l3=el('div',r,'ctr serif','top:604px;font-size:178px;line-height:1','<span class="mark">the typo.</span>');
  o.tiles=makeTiles(r,'GTG',880,['','bad','']);
  const T=o.tiles[1];const tx=+T.dataset.x+75,ty=966;
  const d=`M ${tx+8} ${ty-122} C ${tx+120} ${ty-118} ${tx+132} ${ty+110} ${tx-6} ${ty+118} C ${tx-128} ${ty+122} ${tx-130} ${ty-100} ${tx-10} ${ty-120} C ${tx+40} ${ty-126} ${tx+70} ${ty-110} ${tx+84} ${ty-96}`;
  o.circ=handPath(r,0,0,1080,1300,d,'#E03A2F',11);
  o.note=el('div',r,'abs hand','left:560px;top:1112px;font-size:62px;color:#E03A2F;transform-origin:0 50%','one wrong letter');
  o.arrow=handPath(r,0,0,1080,1300,`M 600 1118 Q 560 1080 ${tx+70} ${ty+70}`,'#E03A2F',7);
  o.arrowHead=handPath(r,0,0,1080,1300,`M ${tx+92} ${ty+58} L ${tx+70} ${ty+70} L ${tx+80} ${ty+94}`,'#E03A2F',7);
  o.marks=[...r.querySelectorAll('.mark')];
},(o,t,lt,loop)=>{
  const W=[0.02,0.25,0.5,0.917,1.85];// The first CRISPR medicine | the typo.
  o.marks.forEach((m,i)=>{const x=loop?0:eo(p(lt,W[i],W[i]+.28));m.style.backgroundSize=`${x*100}% 100%`});
  const pun=loop?0:Math.sin(Math.PI*p(lt,1.33,1.6));tf(o.l2,`scale(${1+pun*.08}) rotate(${-pun*1.5}deg)`);
  draw_on(o.circ.pth,o.circ.len,loop?0:eio(p(lt,1.85,2.25)));
  const n=loop?0:eb(p(lt,2.2,2.45));op(o.note,n);tf(o.note,`rotate(-6deg) scale(${lerp(.6,1,n)})`);
  draw_on(o.arrow.pth,o.arrow.len,loop?0:eo(p(lt,2.3,2.5)));draw_on(o.arrowHead.pth,o.arrowHead.len,loop?0:eo(p(lt,2.48,2.58)));
  o.tiles.forEach((tl,i)=>tf(tl,`translateY(${Math.sin(lt*3+i*1.3)*5}px)`));
},{hook:true});

// 2) SICKLE
scene(2.817,6.55,(r,o)=>{
  o.h1=el('div',r,'ctr serif','top:190px;font-size:128px;color:#E03A2F;line-height:1','sickle cell disease');
  o.h2=el('div',r,'ctr sans','top:330px;font-size:62px','comes from <span style="color:#E03A2F">one wrong letter</span>');
  o.ph=makePhotoScope(r,540,700,255,'img/smear.jpg',1200);
  o.hl=handPath(r,0,0,1080,1300,'M 600 640 C 660 650 668 760 560 770 C 450 778 420 660 500 632 C 540 620 590 626 612 646','#E03A2F',9);
  o.scopeLbl=el('div',r,'abs hand','left:745px;top:420px;font-size:50px;line-height:1;color:#E03A2F;transform:rotate(8deg)','a real sickled<br>blood cell');

function shake(t){let s=0;for(const[a,amp]of[[8.95,14],[13.22,10],[20.12,10]]){const k=p(t,a,a+.35);if(k>0&&k<1)s+=amp*(1-k)}return s}

  parts.forEach(q=>{const ph2=2*Math.PI*t/END;q.e.style.transform=`translate(${q.x+Math.sin(ph2*q.sp*2+q.ph)*60*q.depth}px,${q.y+Math.cos(ph2*q.sp+q.ph)*80*q.depth}px)`});
